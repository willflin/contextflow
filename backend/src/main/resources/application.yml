server:
  port: 8080

spring:
  application:
    name: contextflow-backend

  ai:
    model:
      chat: ${CONTEXTFLOW_AI_CHAT_MODEL:none}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: ${DEEPSEEK_TEMPERATURE:0.2}

  datasource:
    url: jdbc:mysql://${CONTEXTFLOW_DB_HOST:localhost}:${CONTEXTFLOW_DB_PORT:3306}/${CONTEXTFLOW_DB_NAME:contextflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${CONTEXTFLOW_DB_USERNAME:contextflow}
    password: ${CONTEXTFLOW_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

contextflow:
  auth:
    seed-demo-users: true
    jwt:
      secret: ${CONTEXTFLOW_JWT_SECRET:contextflow-dev-secret-key-change-before-production-32bytes}
      access-token-ttl-seconds: 3600
  placement:
    seed-demo-items: true
  scenario:
    seed-demo-templates: true
  content:
    seed-demo-units: ${CONTEXTFLOW_SEED_DEMO_UNITS:false}
  review:
    priority-refresh-enabled: true
    priority-refresh-initial-delay-ms: 60000
    priority-refresh-fixed-delay-ms: 3600000
  agent:
    provider: ${CONTEXTFLOW_AGENT_PROVIDER:local}
    fallback-to-local-on-error: true
