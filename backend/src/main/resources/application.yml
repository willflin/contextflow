server:
  port: 8080

spring:
  application:
    name: contextflow-backend

  datasource:
    url: jdbc:mysql://${CONTEXTFLOW_DB_HOST:localhost}:${CONTEXTFLOW_DB_PORT:3306}/${CONTEXTFLOW_DB_NAME:contextflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${CONTEXTFLOW_DB_USERNAME:contextflow}
    password: ${CONTEXTFLOW_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

contextflow:
  auth:
    seed-demo-users: true
    jwt:
      secret: ${CONTEXTFLOW_JWT_SECRET:contextflow-dev-secret-key-change-before-production-32bytes}
      access-token-ttl-seconds: 3600
  placement:
    seed-demo-items: true
  scenario:
    seed-demo-templates: true
